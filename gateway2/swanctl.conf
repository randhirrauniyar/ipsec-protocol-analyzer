connections {
    gw2-to-gw1 {
        local_addrs  = 192.168.100.20
        remote_addrs = 192.168.100.10
        proposals    = 3des-md5-modp1024,aes128-sha256-modp2048

        local {
            auth = psk
            id   = gw2@lab.local
        }
        remote {
            auth = psk
            id   = gw1@lab.local
        }
        children {
            net-to-net {
                local_ts      = 192.168.100.20/32
                remote_ts     = 192.168.100.10/32
                esp_proposals = 3des-md5,aes128-sha256
                mode          = tunnel
            }
        }
        version = 2
    }
}

secrets {
    ike-gw2 {
        id     = gw1@lab.local
        secret = "VpnLabKey2026Secure!"
    }
}
